name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --working-dir=playgrounds/laravel --no-interaction --prefer-dist
      - run: pnpm --dir tests/browser exec playwright install --with-deps chromium webkit
      - run: pnpm check
      - run: pnpm verify
      - run: pnpm playground:build
      - run: pnpm playground:test
